services:

  postgres:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./clients.csv:/docker-entrypoint-initdb.d/clients.csv
      -  postgres_data:/var/lib/postgresql                               #чтобы сохранить базу
  api:
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    ports:
    - "8000:8000"
    

  redis:
    image: redis:8


volumes:
  postgres_data:
